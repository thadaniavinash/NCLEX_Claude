<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 376" font-family="Arial, Helvetica, sans-serif">
  <title>Creatinine and urine output on hospital day 4</title>
  <rect width="600" height="376" fill="#ffffff"/>
  <text x="300" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e293b">Day 4: the kidneys are not keeping up</text>
  <!-- left chart: creatinine bars, scale 0-200 umol/L over 200 px -->
  <text x="150" y="54" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e293b">Serum creatinine (µmol/L)</text>
  <line x1="50" y1="270" x2="270" y2="270" stroke="#475569"/>
  <rect x="80" y="192" width="60" height="78" fill="#93c5fd"/>
  <rect x="170" y="107" width="60" height="163" fill="#ef4444"/>
  <line x1="60" y1="114" x2="260" y2="114" stroke="#b91c1c" stroke-dasharray="5 4"/>
  <text x="60" y="130" font-size="11" fill="#b91c1c">2 × baseline = 156</text>
  <g font-size="13" text-anchor="middle" fill="#1e293b">
    <text x="110" y="186" font-weight="bold">78</text><text x="200" y="101" font-weight="bold">163</text>
    <text x="110" y="288">Admission</text><text x="200" y="288">Day 4</text>
  </g>
  <!-- right chart: urine output -->
  <text x="450" y="54" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e293b">24-hour intake and urine output</text>
  <line x1="350" y1="270" x2="570" y2="270" stroke="#475569"/>
  <!-- scale 0-1600 mL over 160 px -->
  <rect x="370" y="110" width="50" height="160" fill="#93c5fd"/>
  <rect x="440" y="232" width="50" height="38" fill="#ef4444"/>
  <rect x="510" y="198" width="50" height="72" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 3"/>
  <g font-size="12.5" text-anchor="middle" fill="#1e293b">
    <text x="395" y="104" font-weight="bold">1,600</text><text x="465" y="226" font-weight="bold">380</text><text x="535" y="192" font-weight="bold" fill="#15803d">≥ 720</text>
    <text x="395" y="288">Intake</text><text x="465" y="288">Urine</text><text x="535" y="288" fill="#15803d">Expected</text>
    <text x="535" y="302" font-size="11" fill="#15803d">0.5 mL/kg/h</text>
  </g>
  <rect x="20" y="314" width="560" height="52" rx="6" fill="#fef2f2" stroke="#fecaca"/>
  <text x="300" y="335" text-anchor="middle" font-size="13" fill="#7f1d1d">Creatinine more than doubled and oliguria despite a good intake:</text>
  <text x="300" y="354" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">possible acyclovir kidney injury. Report it now.</text>
</svg>
