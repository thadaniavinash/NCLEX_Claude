name: Supabase

# Talks to NCLEX_Claude's own Supabase project via tools/supabase.js.
# The original app's database is only read (compare-original), never written.
on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        options: [ping, check, compare-original, download, add, patch, upload]
        default: ping
      file:
        description: For "add", the item file(s) in the repo, space-separated (e.g. drafts/case_x.json); for "patch", the patch file (e.g. drafts/content_patch.json)
        required: false
        default: ''
  schedule:
    # Daily backup: reads the database (which also keeps the free-tier project from pausing) and
    # commits cases-data.js and backup/items/ when anything changed.
    - cron: '17 6 * * *'

permissions:
  contents: write # "download" commits the refreshed cases-data.js backup

jobs:
  supabase:
    runs-on: ubuntu-latest
    env:
      # Needed to write once saving is restricted to admins (supabase/002_admin_logins.sql).
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # compare-original reads the data as it was when the copy was made
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run tools/supabase.js
        env:
          ACTION: ${{ inputs.action || 'download' }}
          FILES: ${{ inputs.file }}
        run: node tools/supabase.js "$ACTION" $FILES
      - name: Commit the refreshed backup
        if: ${{ github.event_name == 'schedule' || inputs.action == 'download' }}
        run: |
          git add -A cases-data.js backup
          if git diff --cached --quiet; then
            echo "The backup already matches the database."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Sync cases-data.js backup from the database"
            git pull --rebase origin main
            git push
          fi
